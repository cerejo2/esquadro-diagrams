notes: >-
  Covers getopts inside a function with a case per option, calls after || and inside { ...; },
  a call inside a while loop at the end of a pipeline (rotate -> log), and two traps
  (trap cleanup EXIT, trap on_interrupt INT TERM) that give call edges with label trap.
  External commands (basename, date, tar, mv, ls, tail, rm, mkdir, mktemp) are hidden by default.
