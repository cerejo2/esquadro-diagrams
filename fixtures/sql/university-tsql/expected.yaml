notes: >-
  Columns in DDL order, names only. PK (underlined): DOCENTE(num_mec); UC(codigo); ALUNO(nmec);
  INSCRICAO(nmec_aluno, codigo_uc). UNIQUE: ALUNO.email. DOCENTE.coordenador is a self-reference.
  Must be skipped: IF DB_ID(...) CREATE DATABASE, USE, SET, DROP TABLE IF EXISTS, PRINT, the procedure
