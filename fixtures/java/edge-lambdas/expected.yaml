notes: >-
  eventos.add(new Evento(l)) inside a lambda is still Agenda's own code, so eventos is a composition.
  Lembrete appears only in Supplier<Lembrete> and in the constructor reference Lembrete::new, Conversor only in
  the static method reference Conversor::normalizar: both are dependencies, not field relations (Supplier is
  not a collection). The local class Linha is not a node, but its field type Formato is a use by Agenda.
  Etiqueta appears only as the declared type of a lambda parameter. Evento.getData is a trivial getter.
