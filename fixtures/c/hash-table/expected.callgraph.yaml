notes: >-
  Three calls go through function pointers. main -> hash_length is an edge (confidence 0.5): pick is a local assigned
  the function name directly and then called. hashtable_slot calls t->hash, a struct field set from a parameter in
  hashtable_create, and hashtable_foreach calls its parameter visit: neither target is known, so no edge (a
  diagnostic instead). main passes hash_djb2 and print_entry as arguments, which are not calls, so those two functions
  have no incoming edges. entry_find is recursive. External calls (malloc, calloc, free, strlen, strcpy, strcmp,
  printf) are hidden by default.
